<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>Video Selection</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(
        circle at top,
        #1b1b1b 0%,
        #090909 45%,
        #050505 100%
      );
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 25px 18px 35px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .logo span {
      color: #ff1744;
    }

    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .video-btn {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #ff1744, #c90032);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
      box-shadow: 0 8px 25px rgba(255, 23, 68, .18);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .video-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255, 23, 68, .32);
    }

    .play-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .16);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-icon::after {
      content: "";
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid #fff;
      margin-left: 2px;
    }

    /* FACEBOOK GROUP BUTTON */
    .facebook-btn {
      margin-top: 25px;
      width: 100%;
      min-height: 68px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #1877F2, #0866FF);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(24, 119, 242, .2);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .facebook-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(24, 119, 242, .35);
    }

    .facebook-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .18);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 29px;
      font-weight: bold;
    }

    .facebook-text {
      flex: 1;
      min-width: 0;
    }

    .facebook-text strong {
      display: block;
      font-size: 13px;
      letter-spacing: .4px;
    }

    .facebook-text small {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.4;
      color: rgba(255, 255, 255, .88);
    }

    .facebook-arrow {
      flex-shrink: 0;
      font-size: 22px;
    }

    @media (max-width: 480px) {
      .container {
        padding-left: 14px;
        padding-right: 14px;
      }

      .logo {
        font-size: 25px;
      }

      .video-btn {
        min-height: 55px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .video-btn,
      .facebook-btn {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">
      Video <span>Selection</span>
    </div>

    <div class="subtitle">
      Choose a video to continue
    </div>

    <div class="buttons">

      <!-- VIDEO 01 -->
      <a class="video-btn"
         href="https://asiafilm.org/4/4c9e3d9e34242a2868abffc45ab464a4"
         target="_blank"
         rel="noopener noreferrer">
        <span class="play-icon" aria-hidden="true"></span>
        <span>WATCH VIDEO 01</span>
      </a>

      <!-- VIDEO 02 -->
      <a class="video-btn"
         href="https://arwf.org/4/52abb2fcafd6c227c9d20ca42b5679c3"
         target="_blank"
         rel="noopener noreferrer">
        <span class="play-icon" aria-hidden="true"></span>
        <span>WATCH VIDEO 02</span>
      </a>

      <!-- VIDEO 03 -->
      <a class="video-btn"
         href="https://videohubza.blogspot.com"
         target="_blank"
         rel="noopener noreferrer">
        <span class="play-icon" aria-hidden="true"></span>
        <span>WATCH VIDEO 03</span>
      </a>

    </div>

    <!-- FACEBOOK GROUP -->
    <a class="facebook-btn"
       href="https://www.facebook.com/groups/xmomentshub"
       target="_blank"
       rel="noopener noreferrer">

      <span class="facebook-icon" aria-hidden="true">f</span>

      <span class="facebook-text">
        <strong>JOIN OUR FACEBOOK GROUP</strong>
        <small>Connect with our community</small>
      </span>

      <span class="facebook-arrow" aria-hidden="true">→</span>
    </a>

  </main>

</body>
</html>
